<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دانلود مدل با Progress Bar</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }
    #progress-container {
      width: 80%;
      margin: 20px auto;
      height: 30px;
      background-color: #eee;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background-color: #3b82f6;
      transition: width 0.2s;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>دانلود مدل زبان</h2>
  <button id="download-btn">دانلود مدل</button>

  <div id="progress-container" style="display:none;">
    <div id="progress-bar"></div>
  </div>

  <div id="status"></div>

  <script>
    document.getElementById('download-btn').addEventListener('click', async () => {
      const btn = document.getElementById('download-btn');
      const bar = document.getElementById('progress-bar');
      const container = document.getElementById('progress-container');
      const status = document.getElementById('status');

      btn.disabled = true;
      container.style.display = 'block';
      status.textContent = "در حال شروع دانلود...";

      try {
        const session = await LanguageModel.create({
          monitor(m) {
            m.addEventListener('downloadprogress', (e) => {
              const percent = (e.loaded * 100).toFixed(2);
              bar.style.width = percent + '%';
              status.textContent = `در حال دانلود مدل: ${percent}%`;
            });
          }
        });

        status.textContent = "✅ دانلود کامل شد و Session ایجاد گردید.";
        bar.style.backgroundColor = "#10b981"; // سبز بعد از اتمام
      } catch (err) {
        status.textContent = "❌ خطا در دانلود مدل: " + err.message;
        bar.style.backgroundColor = "#ef4444";
      } finally {
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
