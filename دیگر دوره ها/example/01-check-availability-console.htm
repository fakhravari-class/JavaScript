<script>
(async function() {
    if (!("LanguageModel" in window)) {
        console.error("API LanguageModel در این مرورگر فعال نیست.");
        return;
    }

    try {
        const availability = await LanguageModel.availability();

        if (availability === 'available') {
            console.log('مدل آماده استفاده است.');
        } else if (availability === 'downloadable') {
            console.log('مدل قابل دانلود است.');
        } else {
            console.log('مدل در دسترس نیست یا در حال دانلود است.');
        }
    } catch (err) {
        console.error("خطا در بررسی وضعیت مدل:", err);
    }
})();
</script>
