<script>
async function answerQuestion() {
    // 1. Feature Detection: Check if the LanguageModel API (Prompt API) exists.
    if (!("LanguageModel" in self)) {
        console.error("API Prompt (LanguageModel) در این مرورگر فعال نیست.");
        console.warn("لطفاً مطمئن شوید که مرورگر شما (Chrome Canary/Dev یا Edge Canary/Dev) است و پرچم‌های (flags) مربوط به هوش مصنوعی را فعال کرده‌اید.");
        return;
    }


	// 2. Create Session: 
	const session = await LanguageModel.create();
	
	// 3. Define the Question (Prompt)
	const question = "پایتخت ایران کجاست؟ فقط نام شهر را بگو.";

	console.log(`سؤال شما: ${question}`);

	// 4. Prompt the model:
	const result = await session.prompt(question);

	// 5. Display the result
	console.log("پاسخ هوش مصنوعی:", result);


	// 6. destroy Session
	session.destroy();
	console.log("نشست هوش مصنوعی پایان یافت و منابع آزاد شدند.");
	
    
}

// function call
answerQuestion();
</script>
