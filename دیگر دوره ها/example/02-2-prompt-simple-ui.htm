<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سؤال و پاسخ AI</title>
<style>
  body { font-family: Arial, sans-serif; padding: 50px; background: #f5f5f5; }
  input[type="text"] { width: 300px; padding: 10px; font-size: 16px; }
  button { padding: 10px 20px; font-size: 16px; margin-left: 10px; cursor: pointer; }
  #answer { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<h2>سؤال خود را وارد کنید:</h2>
<input type="text" id="userQuestion" placeholder="مثال: پایتخت ایران کجاست؟">
<button id="askBtn">پاسخ بده</button>

<div id="answer"></div>

<script>
const askBtn = document.getElementById("askBtn");
const answerDiv = document.getElementById("answer");

async function answerQuestion(question) {
    if (!("LanguageModel" in self)) {
        answerDiv.textContent = "API Prompt (LanguageModel) در این مرورگر فعال نیست.";
        return;
    }

    const session = await LanguageModel.create();
    const result = await session.prompt(question);
    answerDiv.textContent = "پاسخ هوش مصنوعی: " + result;
    session.destroy();
}

askBtn.onclick = () => {
    const question = document.getElementById("userQuestion").value.trim();
    if(question) {
        answerDiv.textContent = "در حال دریافت پاسخ...";
        answerQuestion(question);
    } else {
        answerDiv.textContent = "لطفاً یک سوال وارد کنید.";
    }
};
</script>

</body>
</html>
