<script type="module">
	const session = await LanguageModel.create({
	  initialPrompts: [
		{ role: "system", content: "وظیفه تو پیش‌بینی حداکثر ۵ ایموجی برای یک نظر است. خروجی باید فقط ایموجی‌های جدا شده با کاما باشد." },
		{ role: "user", content: "این فوق‌العاده است!" },
		{ role: "assistant", content: "❤️,➕" },
		{ role: "user", content: "عالی به نظر می‌رسه" },
		{ role: "assistant", content: "👍,🚢" }
	  ]
	});

	const text1 = "عجب فیلم خفنی بود."
	console.log(text1); 
	const freshSession1 = await session.clone();
	const result1 = await freshSession1.prompt(text1);
	console.log(result1); 

	const text2 = "دوره LLM اخوان تو مکتب خونه دوره خوبیه"
	console.log(text2); 
	const freshSession2 = await session.clone();
	const result2 = await freshSession2.prompt(text2);
	console.log(result2); 
	
	const text3 = "امروز تو راه سرم تو موبایل بود و از پشت زدم به ماشین جلویی و چراغ عقبش شکست."
	console.log(text3); 
	const freshSession3 = await session.clone();
	const result3 = await freshSession3.prompt(text3);
	console.log(result3); 
	
	await freshSession1.destroy();
	await freshSession2.destroy();
	await freshSession3.destroy();
	await session.destroy();

</script>
