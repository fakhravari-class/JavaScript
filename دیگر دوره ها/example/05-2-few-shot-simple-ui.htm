<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>پیش‌بینی ایموجی</title>
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/css/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  body {
    font-family: 'Vazirmatn', sans-serif;
    direction: rtl;
    background-color: #f5f7fa;
    padding: 40px;
    text-align: center;
  }
  h2 {
    color: #333;
    margin-bottom: 20px;
  }
  textarea {
    width: 90%;
    max-width: 500px;
    height: 80px;
    font-size: 16px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    resize: none;
    margin-bottom: 10px;
  }
  button {
    font-family: 'Vazirmatn', sans-serif;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #007bff;
    color: white;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover {
    background-color: #0056b3;
  }
  .history {
    margin: 25px auto;
    max-width: 500px;
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
    text-align: right;
  }
  .entry {
    border-bottom: 1px solid #eee;
    padding: 8px 0;
  }
  .entry:last-child {
    border-bottom: none;
  }
  .text {
    color: #555;
  }
  .emoji {
    font-size: 20px;
    color: #000;
  }
  .user-input {
    margin-top: 25px;
  }
</style>
</head>
<body>

<h2>پیش‌بینی ایموجی برای جمله شما 😄</h2>

<div class="user-input">
  <textarea id="inputText" placeholder="جمله‌ات را بنویس..."></textarea><br>
  <button id="runBtn">پیش‌بینی ایموجی</button>
</div>

<div class="history" id="history"></div>

<script type="module">
async function main() {
  const historyEl = document.getElementById("history");
  const inputEl = document.getElementById("inputText");
  const btn = document.getElementById("runBtn");

  // ساخت session اصلی
  const session = await LanguageModel.create({
    initialPrompts: [
      { role: "system", content: "وظیفه تو پیش‌بینی حداکثر ۵ ایموجی برای یک نظر است. خروجی باید فقط ایموجی‌های جدا شده با کاما باشد." },
      { role: "user", content: "این فوق‌العاده است!" },
      { role: "assistant", content: "❤️,🔥,💯" }
    ]
  });

  btn.addEventListener("click", async () => {
    const text = inputEl.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "در حال پیش‌بینی... ⏳";

    try {
      const fresh = await session.clone();
      const result = await fresh.prompt(text);
      await fresh.destroy();

      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `
        <div class="text"><strong>جمله:</strong> ${text}</div>
        <div class="emoji"><strong>ایموجی:</strong> ${result}</div>
      `;
      historyEl.prepend(div); // آخرین مورد بالا نمایش داده شود
      inputEl.value = "";
    } catch (err) {
      alert("خطا در پیش‌بینی: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "پیش‌بینی ایموجی";
    }
  });

  // پاک‌سازی session هنگام بستن صفحه
  window.addEventListener("beforeunload", async () => {
    await session.destroy();
  });
}

main();
</script>

</body>
</html>
