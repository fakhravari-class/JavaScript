<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>امتیاز بازخورد</title>
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/css/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  body {
    font-family: 'Vazirmatn', sans-serif;
    direction: rtl;
    background-color: #f5f7fa;
    padding: 40px;
    text-align: center;
  }
  h2 {
    color: #333;
    margin-bottom: 20px;
  }
  textarea {
    width: 90%;
    max-width: 500px;
    height: 80px;
    font-size: 16px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    resize: none;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #28a745;
    color: white;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover {
    background-color: #1e7e34;
  }
  .result {
    margin-top: 25px;
    font-size: 22px;
    color: #000;
  }
</style>
</head>
<body>

<h2>خلاصه بازخورد به امتیاز عددی 🌟</h2>

<textarea id="feedback" placeholder="مثلاً: غذا خوشمزه بود، سرویس عالی بود، حتماً پیشنهاد می‌کنم."></textarea><br>
<button id="analyzeBtn">محاسبه امتیاز</button>

<div class="result" id="output"></div>

<script type="module">
async function main() {
  const outputEl = document.getElementById("output");
  const feedbackEl = document.getElementById("feedback");
  const btn = document.getElementById("analyzeBtn");

  const session = await LanguageModel.create();

  const schema = {
    type: "object",
    required: ["rating"],
    additionalProperties: false,
    properties: {
      rating: { type: "number", minimum: 0, maximum: 5 },
    },
  };

  btn.addEventListener("click", async () => {
    const feedback = feedbackEl.value.trim();
    if (!feedback) return;

    outputEl.textContent = "در حال تحلیل بازخورد... ⏳";
    btn.disabled = true;

    try {
      const result = await session.prompt(
        `این بازخورد را به یک امتیاز بین ۰ تا ۵ خلاصه کن: ${feedback}`,
        { responseConstraint: schema }
      );

      const { rating } = JSON.parse(result);
      outputEl.textContent = `⭐ امتیاز شما: ${rating.toFixed(1)} از ۵`;
      feedbackEl.value = "";
    } catch (err) {
      outputEl.textContent = "❌ خطا در تحلیل: " + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  window.addEventListener("beforeunload", async () => {
    await session.destroy();
  });
}

main();
</script>

</body>
</html>
