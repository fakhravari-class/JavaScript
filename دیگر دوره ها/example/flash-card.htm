},
{
&quot;f&quot;: &quot;کتابخانه Transformers.js برای اجرای مدل‌ها در مرورگر از کدام runtime استفاده می‌کند؟&quot;,
&quot;b&quot;: &quot;ONNX Runtime.&quot;
},
{
&quot;f&quot;: &quot;ساده‌ترین راه برای استفاده از مدل‌ها در Transformers.js، استفاده از API _____ است که پیش‌پردازش و پس‌پردازش را خودکار می‌کند.&quot;,
&quot;b&quot;: &quot;pipeline&quot;
},
{
&quot;f&quot;: &quot;برای اجرای یک مدل با استفاده از GPU در Transformers.js، چه گزینه‌ای باید تنظیم شود؟&quot;,
&quot;b&quot;: &quot;گزینه `device: 'webgpu'`.&quot;
},
{
&quot;f&quot;: &quot;به منظور کاهش حجم مدل و بهینه‌سازی عملکرد در محیط‌های با منابع محدود، از چه تکنیکی در Transformers.js استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;کوانتیزه‌سازی (Quantization) با تنظیم گزینه `dtype`.&quot;
},
{
&quot;f&quot;: &quot;در Prompt API، برای ارائه مثال‌هایی از تعامل کاربر و دستیار به مدل (N-shot prompting)، از کدام گزینه در `LanguageModel.create()` استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;گزینه `initialPrompts`.&quot;
},
{
&quot;f&quot;: &quot;اگر مجموع توکن‌های پرامپت‌های اولیه در Prompt API بیش از حد مجاز باشد، کدام خطا رخ می‌دهد؟&quot;,
&quot;b&quot;: &quot;خطای `QuotaExceededError`.&quot;
},
{
&quot;f&quot;: &quot;برای اینکه مدل یک پیام دستیار (assistant) را ادامه دهد به جای اینکه پاسخ جدیدی تولید کند، از چه گزینه‌ای در آن پیام استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;گزینه `prefix: true`.&quot;
},
{
&quot;f&quot;: &quot;برای بررسی میزان توکن‌های مصرفی یک پرامپت بدون ارسال واقعی آن، کدام متد در Prompt API به کار می‌رود؟&quot;,
&quot;b&quot;: &quot;متد `measureInputUsage()`.&quot;
},
{
&quot;f&quot;: &quot;زمانی که یک پرامپت جدید باعث پر شدن پنجره زمینه (context window) می‌شود، کدام رویداد (event) در جلسه فعال می‌شود؟&quot;,
&quot;b&quot;: &quot;رویداد `quotaoverflow`.&quot;
},
{
&quot;f&quot;: &quot;در Prompt API، برای پشتیبانی از ورودی‌های چندوجهی (multimodal) مانند تصویر یا صدا، از کدام گزینه در `LanguageModel.create()` باید استفاده کرد؟&quot;,
&quot;b&quot;: &quot;گزینه `expectedInputs`.&quot;
},
{
&quot;f&quot;: &quot;کدام یک از APIهای Built-in AI در کروم از مدل Gemini Nano استفاده می‌کنند؟&quot;,
&quot;b&quot;: &quot;APIهای Prompt, Summarizer, Writer, Rewriter و Proofreader.&quot;
},
{
&quot;f&quot;: &quot;یکی از پیش‌نیازهای سخت‌افزاری برای اجرای مدل‌های Gemini Nano در کروم چیست؟&quot;,
&quot;b&quot;: &quot;حداقل ۴ گیگابایت VRAM برای GPU یا حداقل ۱۶ گیگابایت RAM برای CPU.&quot;
},
{
&quot;f&quot;: &quot;در Microsoft Edge، کدام مدل زبان کوچک (SLM) توسط Prompt API استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;مدل Phi-4-mini.&quot;
},
{
&quot;f&quot;: &quot;برای فعال‌سازی Prompt API در Microsoft Edge، کاربر باید به کدام آدرس داخلی مرورگر مراجعه کند؟&quot;,
&quot;b&quot;: &quot;آدرس `edge://flags/`.&quot;
},
{
&quot;f&quot;: &quot;در Prompt API، پارامتر `temperature` چه چیزی را کنترل می‌کند؟&quot;,
&quot;b&quot;: &quot;میزان تصادفی بودن خروجی مدل؛ مقادیر پایین‌تر منجر به خروجی‌های قطعی‌تر می‌شوند.&quot;
},
{
&quot;f&quot;: &quot;پارامتر `topK` در Prompt API چه نقشی دارد؟&quot;,
&quot;b&quot;: &quot;تعداد کلماتی که برای پیش‌بینی کلمه بعدی در نظر گرفته می‌شوند را محدود می‌کند.&quot;
},
{
&quot;f&quot;: &quot;کدام API برای ترجمه محتوای متنی در سمت کاربر (client-side) و بدون نیاز به سرور طراحی شده است؟&quot;,
&quot;b&quot;: &quot;Translator API.&quot;
},
{
&quot;f&quot;: &quot;برای استفاده از Translator API، باید یک مترجم با مشخص کردن _____ و _____ ایجاد کرد.&quot;,
&quot;b&quot;: &quot;زبان مبدأ (`sourceLanguage`) و زبان مقصد (`targetLanguage`).&quot;
},
{
&quot;f&quot;: &quot;برای بررسی اینکه آیا یک جفت زبان خاص توسط Translator API پشتیبانی می‌شود، از کدام متد استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;متد `Translator.availability()` با ارسال جفت زبان.&quot;
},
{
&quot;f&quot;: &quot;در Writing Assistance APIs، کدام API برای تغییر و بازنویسی یک متن موجود با لحن یا طول متفاوت استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;Rewriter API.&quot;
},
{
&quot;f&quot;: &quot;در `Summarizer.create()`، پارامتر `length` چه مقادیری را می‌پذیرد؟&quot;,
&quot;b&quot;: &quot;مقادیر \&quot;short\&quot;, \&quot;medium\&quot; و \&quot;long\&quot;.&quot;
},
{
&quot;f&quot;: &quot;کدام سیاست مجوز (Permissions Policy) دسترسی به Prompt API را در iframes کنترل می‌کند؟&quot;,
&quot;b&quot;: &quot;دستور `language-model`.&quot;
},
{
&quot;f&quot;: &quot;کدام سیاست مجوز (Permissions Policy) دسترسی به Summarizer API را کنترل می‌کند؟&quot;,
&quot;b&quot;: &quot;دستور `summarizer`.&quot;
},
{
&quot;f&quot;: &quot;چرا APIهای Built-in AI در حال حاضر در Web Workers در دسترس نیستند؟&quot;,
&quot;b&quot;: &quot;به دلیل پیچیدگی در تعیین سند مسئول (responsible document) برای بررسی وضعیت Permissions Policy.&quot;
},
{
&quot;f&quot;: &quot;برای جلوگیری از دانلودهای غیرضروری و پرهزینه مدل‌های هوش مصنوعی، چه توصیه‌ای در مستندات شده است؟&quot;,
&quot;b&quot;: &quot;بارگذاری مدل تا زمانی که برنامه به آن نیاز پیدا کند یا تعامل کافی کاربر نشان‌دهنده ماندن او در صفحه باشد، به تعویق انداخته شود.&quot;
},
{
&quot;f&quot;: &quot;در Background Fetch API، متد `getResourceSize()` با ارسال یک درخواست _____ اندازه فایل را بدست می‌آورد.&quot;,
&quot;b&quot;: &quot;درخواست `HEAD`.&quot;
},
{
&quot;f&quot;: &quot;پس از شروع یک دانلود پس‌زمینه، مرورگر یک شیء _____ برمی‌گرداند که می‌توان از آن برای نمایش پیشرفت دانلود استفاده کرد.&quot;,
&quot;b&quot;: &quot;شیء `BackgroundFetchRegistration`.&quot;
},
{
&quot;f&quot;: &quot;برای لغو یک دانلود در حال انجام در Background Fetch API، از کدام متد استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;متد `abort()` روی شیء `BackgroundFetchRegistration`.&quot;
},
{
&quot;f&quot;: &quot;هدف از قابلیت «tool use» در Prompt API چیست؟&quot;,
&quot;b&quot;: &quot;تعریف قابلیت‌های خارجی (توابع جاوااسکریپت) که مدل زبان می‌تواند آن‌ها را فراخوانی کند.&quot;
},
{
&quot;f&quot;: &quot;در Prompt API، چه نوع ورودی‌هایی برای تصاویر پشتیبانی می‌شوند؟&quot;,
&quot;b&quot;: &quot;انواع `ImageBitmapSource` مانند `Blob`, `ImageData`, `HTMLImageElement` و غیره.&quot;
},
{
&quot;f&quot;: &quot;اگر داده‌های با منشأ متقاطع (cross-origin) در Prompt API استفاده شوند، چه خطایی رخ می‌دهد؟&quot;,
&quot;b&quot;: &quot;یک `\&quot;SecurityError\&quot; DOMException`.&quot;
},
{
&quot;f&quot;: &quot;کتابخانه Transformers.js از چه تکنولوژی برای اجرای مدل‌ها روی CPU در مرورگر استفاده می‌کند؟&quot;,
&quot;b&quot;: &quot;از WebAssembly (WASM).&quot;
},
{
&quot;f&quot;: &quot;در Transformers.js، کدام وظیفه (task) برای تبدیل یک دنباله متن به دنباله متنی دیگر استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;وظیفه `text2text-generation`.&quot;
},
{
&quot;f&quot;: &quot;در Transformers.js، کدام وظیفه برای رونویسی یک فایل صوتی به متن استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;وظیفه `automatic-speech-recognition`.&quot;
},
{
&quot;f&quot;: &quot;در Prompt API، برای ارسال پیام‌هایی به مدل قبل از پرامپت نهایی جهت پیش‌پردازش، از کدام متد استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;متد `append()`.&quot;
},
{
&quot;f&quot;: &quot;کدام مدل‌های زبانی به عنوان مدل‌های instruction-tuned توصیف می‌شوند؟&quot;,
&quot;b&quot;: &quot;مدل‌هایی که برای دنبال کردن دستورالعمل‌ها آموزش دیده‌اند، برخلاف مدل‌های پایه که فقط متن را تکمیل می‌کنند.&quot;
},
{
&quot;f&quot;: &quot;در کروم، برای مشاهده اطلاعات داخلی مربوط به مدل‌های هوش مصنوعی روی دستگاه، به کدام آدرس می‌توان مراجعه کرد؟&quot;,
&quot;b&quot;: &quot;آدرس `chrome://on-device-internals`.&quot;
},
{
&quot;f&quot;: &quot;اگر فضای ذخیره‌سازی موجود در دستگاه کاربر به کمتر از ۱۰ گیگابایت برسد، چه اتفاقی برای مدل دانلود شده Gemini Nano می‌افتد؟&quot;,
&quot;b&quot;: &quot;مدل از دستگاه حذف می‌شود.&quot;
},
{
&quot;f&quot;: &quot;در Microsoft Edge، اگر کلاس عملکرد دستگاه (Device performance class) کمتر از `High` باشد، چه اتفاقی می‌افتد؟&quot;,
&quot;b&quot;: &quot;Prompt API و Writing Assistance APIs روی آن دستگاه پشتیبانی نخواهند شد.&quot;
},
{
&quot;f&quot;: &quot;وظیفه اصلی `Rewriter API` چیست؟&quot;,
&quot;b&quot;: &quot;تبدیل و بازنویسی متن ورودی بر اساس درخواست‌هایی مانند تغییر لحن یا طول.&quot;
},
{
&quot;f&quot;: &quot;در Summarizer API، پارامتر `format` چه مقادیری را می‌پذیرد؟&quot;,
&quot;b&quot;: &quot;مقادیر \&quot;markdown\&quot; (پیش‌فرض) و \&quot;plain-text\&quot;.&quot;
},
{
&quot;f&quot;: &quot;کدام مدل زبانی در مستندات به عنوان پایه مدل‌های Gemma معرفی شده است؟&quot;,
&quot;b&quot;: &quot;مدل Gemini.&quot;
},
{
&quot;f&quot;: &quot;کدام API برای تشخیص اینکه آیا یک متن حاوی زبان سمی است یا خیر، می‌تواند کاربرد داشته باشد؟&quot;,
&quot;b&quot;: &quot;Language Detector API (برای تعیین زبان) و سپس یک مدل طبقه‌بندی متن.&quot;
},
{
&quot;f&quot;: &quot;برای اطمینان از اینکه مدل زبانی به درخواست‌های مخرب (adversarial inputs) پاسخ درستی می‌دهد، چه توصیه‌ای در مستندات شده است؟&quot;,
&quot;b&quot;: &quot;توصیه شده که پیاده‌سازی‌ها در برابر چنین ورودی‌هایی مقاوم باشند، هرچند این یک حوزه تحقیقاتی فعال است.&quot;
},
{
&quot;f&quot;: &quot;برای مطلع کردن کاربر از پیشرفت دانلود مدل در APIهایی مانند `Summarizer` یا `Prompt API`، از کدام گزینه در متد `create()` استفاده می‌شود؟&quot;,
&quot;b&quot;: &quot;گزینه `monitor` که یک تابع callback می‌پذیرد.&quot;
},
{
&quot;f&quot;: &quot;رویداد `downloadprogress` که در گزینه `monitor` شنیده می‌شود، یک شیء `ProgressEvent` است که ویژگی `loaded` آن مقداری بین _____ و _____ دارد.&quot;,
&quot;b&quot;: &quot;بین ۰ و ۱.&quot;
}
]
}
